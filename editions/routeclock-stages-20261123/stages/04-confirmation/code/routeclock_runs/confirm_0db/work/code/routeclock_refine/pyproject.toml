[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "routeclock"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pandas", "scikit-learn", "lightgbm", "torch", "chronos-forecasting", "tabpfn", "matplotlib", "psutil"]
[project.scripts]
routeclock = "routeclock.cli:main"
[tool.setuptools.packages.find]
include = ["routeclock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
